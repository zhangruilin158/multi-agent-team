<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 812" width="100%" role="img">
  <title>多智能体团队搭建 · 运行流程</title>
  <desc>触发到交付的完整流程：判定需求形态（四类分支）→ 内部选型 → 组建领域小组（每领域至少 2 名专家，从不去重的全量清单招募）→ 小组讨论（选出最佳方案及理由）→ 团队讨论（确定如何实施）→ 落地执行或给出具体示例 → 交付与安全提示</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;font-weight:500}
      .s{font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;font-weight:400}
      .ln{stroke:#888780;stroke-width:1.5;fill:none}
    </style>
  </defs>

  <text class="t" x="340" y="32" text-anchor="middle" fill="#2C2C2A">多智能体团队搭建 · 运行流程</text>

  <!-- 1. 触发 -->
  <g>
    <rect x="240" y="56" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t" x="340" y="83" text-anchor="middle" fill="#042C53">用户说「多Agent团队」</text>
  </g>

  <!-- connector 触发->判定 -->
  <polyline class="ln" points="340,100 340,128" marker-end="url(#arrow)"/>

  <!-- 2. 判定需求形态（内部） -->
  <g>
    <rect x="240" y="130" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
    <text class="t" x="340" y="157" text-anchor="middle" fill="#26215C">判定需求形态（内部）</text>
  </g>

  <!-- connector 判定->bus -->
  <polyline class="ln" points="340,174 340,196"/>
  <polyline class="ln" points="110,196 572,196"/>
  <polyline class="ln" points="110,196 110,224" marker-end="url(#arrow)"/>
  <polyline class="ln" points="264,196 264,224" marker-end="url(#arrow)"/>
  <polyline class="ln" points="418,196 418,224" marker-end="url(#arrow)"/>
  <polyline class="ln" points="572,196 572,224" marker-end="url(#arrow)"/>

  <!-- 3. 四类形态分支 -->
  <g>
    <rect x="40" y="224" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t" x="110" y="245" text-anchor="middle" fill="#042C53">现成专家人设</text>
    <text class="s" x="110" y="265" text-anchor="middle" fill="#185FA5">四库·统一角色池</text>
  </g>
  <g>
    <rect x="194" y="224" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t" x="264" y="245" text-anchor="middle" fill="#042C53">代码搭 SDK</text>
    <text class="s" x="264" y="265" text-anchor="middle" fill="#185FA5">能力类型五选一</text>
  </g>
  <g>
    <rect x="348" y="224" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t" x="418" y="245" text-anchor="middle" fill="#042C53">开箱应用</text>
    <text class="s" x="418" y="265" text-anchor="middle" fill="#185FA5">编排器·工作台</text>
  </g>
  <g>
    <rect x="502" y="224" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t" x="572" y="245" text-anchor="middle" fill="#042C53">企业级框架</text>
    <text class="s" x="572" y="265" text-anchor="middle" fill="#185FA5">国产 Python</text>
  </g>

  <!-- connector forms->merge bus -->
  <polyline class="ln" points="110,280 110,302"/>
  <polyline class="ln" points="264,280 264,302"/>
  <polyline class="ln" points="418,280 418,302"/>
  <polyline class="ln" points="572,280 572,302"/>
  <polyline class="ln" points="110,302 572,302"/>
  <polyline class="ln" points="340,302 340,322" marker-end="url(#arrow)"/>

  <!-- 4. 内部选型 -->
  <g>
    <rect x="240" y="322" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
    <text class="t" x="340" y="349" text-anchor="middle" fill="#26215C">内部选型（不对外纠结）</text>
  </g>

  <!-- connector 选型->组队 -->
  <polyline class="ln" points="340,366 340,392" marker-end="url(#arrow)"/>

  <!-- 5. 组建领域小组 -->
  <g>
    <rect x="190" y="394" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t" x="340" y="415" text-anchor="middle" fill="#042C53">组建领域小组</text>
    <text class="s" x="340" y="435" text-anchor="middle" fill="#185FA5">每领域 ≥2 名专家 · 从全量清单(608)招募</text>
  </g>

  <!-- connector 组队->小组讨论 -->
  <polyline class="ln" points="340,450 340,476" marker-end="url(#arrow)"/>

  <!-- 6. 小组讨论 -->
  <g>
    <rect x="190" y="478" width="300" height="56" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
    <text class="t" x="340" y="499" text-anchor="middle" fill="#173404">小组讨论（领域小组内部）</text>
    <text class="s" x="340" y="519" text-anchor="middle" fill="#3B6D11">比较思路 → 选哪个方案 + 理由</text>
  </g>

  <!-- connector 小组->团队 -->
  <polyline class="ln" points="340,534 340,560" marker-end="url(#arrow)"/>

  <!-- 7. 团队讨论 -->
  <g>
    <rect x="190" y="562" width="300" height="56" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
    <text class="t" x="340" y="583" text-anchor="middle" fill="#173404">团队讨论（跨领域全团队）</text>
    <text class="s" x="340" y="603" text-anchor="middle" fill="#3B6D11">衔接·职责·顺序 → 如何实施该方案</text>
  </g>

  <!-- connector 团队->落地 -->
  <polyline class="ln" points="340,618 340,644" marker-end="url(#arrow)"/>

  <!-- 8. 落地执行 -->
  <g>
    <rect x="190" y="646" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t" x="340" y="667" text-anchor="middle" fill="#042C53">落地执行</text>
    <text class="s" x="340" y="687" text-anchor="middle" fill="#185FA5">能跑就执行 · 不能则给具体示例</text>
  </g>

  <!-- connector 落地->交付 -->
  <polyline class="ln" points="340,702 340,728" marker-end="url(#arrow)"/>

  <!-- 9. 交付 + 安全 -->
  <g>
    <rect x="190" y="730" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="t" x="340" y="751" text-anchor="middle" fill="#042C53">交付说明 + 安全提示</text>
    <text class="s" x="340" y="771" text-anchor="middle" fill="#185FA5">密钥管理 · 费用 · 沙箱隔离</text>
  </g>
</svg>
